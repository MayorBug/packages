# Config format version. Change only during a documented upgrade.
config_version=2

# Mode: kernel, auto, curve, manual, or disabled.
mode=kernel

# Control loop interval in seconds (1-60).
control_interval_s=2

# hwmon driver name that exposes pwm1.
hwmon_name=pwmfan

# Thermal zone type used for required CPU temperature.
thermal_zone=cpu-thermal

# Read fan1_input and detect a stopped fan (0 or 1).
tach_enabled=1

# Temperature filter: none or median.
temperature_filter=median

# Median filter duration in seconds: 5, 10, or 15.
temperature_filter_duration_s=10

# Optional Wi-Fi source: off, auto, or a supported MediaTek hwmon name.
wifi_source=off

# Optional modem source: off, qmanager_http, or quectel_at.
modem_source=off

# QManager host or IPv4 address.
modem_http_host=192.168.224.1

# Quectel AT port.
modem_at_device=/dev/ttyUSB2

# Modem polling interval in seconds (10-30).
modem_interval_s=15

# Auto target temperature in degrees Celsius (30-100).
pid_target_c=55

# Auto proportional gain in output per degree Celsius (0-0.20).
pid_kp=0.1

# Auto integral gain in output per degree-second (0-0.001667).
pid_ki=0.0005

# Auto derivative gain in output-seconds per degree Celsius (0-1.20).
pid_kd=0.10

# Maximum accumulated integral output (0-1.00).
pid_integral_limit=0.60

# Curve interpolation: step or smooth.
curve_style=smooth

# Step-mode hysteresis in degrees Celsius (0-20).
curve_hysteresis_c=2

# Curve points as ascending temperature:percent pairs.
curve_points=45:0,55:38,65:50,75:75,85:100

# Manual requested fan output in percent (0-100).
manual_output_percent=50

# Minutes before Manual returns to Kernel; 0 disables timeout.
manual_timeout_min=0
